# Tiny nanoHEP particle-flow model for a CPU smoke run (a few minutes on a laptop).
# Same data, vocabulary and task as nanohep_pflow.yml; only model size and budget differ.
#   python -m hep4m.train_nano_hep -ct configs/train/nanohep_pflow_tiny.yml -g cpu
project_name: hep-any2any
run_name: nanohep_pflow_tiny
base_root_dir: ${HEP4M_RUNS}

device: cpu
num_devices: 1
trainer_precision: 32-true
num_epochs: 2
max_steps: 50
eval_every_n_epoch: 1
val_check_interval: 25
periodic_checkpoint_interval: 1
step_checkpoint_interval: 25
accumulate_grad_batches: 1

gpt_config:
    block_size: 640
    vocab_size: null
    n_layer: 2
    n_head: 2
    n_embd: 64
    dropout: 0.0
    bias: false

vocab_args:
    modalities: [topo, track, truthpart]

optimizer_args:
    learning_rate: 1.0e-3
    weight_decay: 0.1
    betas: [0.9, 0.95]
    lr_schedule:
        peak: 1.0e-3
        floor: 1.0e-4
        warmup_steps: 10
        decay_steps: 50

tokenized_root: ${HEP4M_TOKENIZED}
all_modalities: [topo, track, truthpart]
block_size: 320
batch_size: 8
num_workers: 0
max_events_train: 400
max_events_val: 32

sampling_dict:
    type: inference
    fixed_input_output_modalities:
        input: [topo, track]
        output: [truthpart]
    output_layout: interleaved
    input_layout: interleaved

pflow_eval:
    enabled: false

early_stopping:
  enabled: false
