project_name: hep-any2any
run_name: hep4m_multi

device: cuda
num_devices: 2                  # GPUs per node
trainer_precision: 'bf16-mixed'

# Any-to-any over all seven modalities: for every event the sampler draws a random
# input subset of 1-3 modalities and uses the rest as outputs.
train_sampling:
  type: inference_rand2
  max_inp_modality: 3
  max_out_modality: null

val_sampling:
  type: inference
  fixed_input_output_modalities:
    input: [truthpart]
    output: [track, topo]

start_idx_train: 0
start_idx_val: 0

reduce_ds_train: -1
reduce_ds_val: -1

# effective batch = batchsize_train * accumulate_grad_batches * GPUs
#                 = 128 * 1 * (2 GPUs x 64 nodes) = 16,384
batchsize_train: 128
batchsize_val: 128
accumulate_grad_batches: 1

contiguous_batches: true
preprocessed_dir: ${HEP4M_TOKENIZED}

num_workers: 3
persistent_workers: true
mp_share_strategy: file_system

num_epochs: 5001                # the released checkpoint is epoch 50 (best val_total_loss)
eval_every_n_epoch: 1
train_log_every_n_steps: 50
periodic_checkpoint_interval: 50

learning_rate: 1.0e-3
weight_decay: 0.05
max_grad_norm: 1.0

scheduler_type: schedulefree
warmup_steps: 2500

base_root_dir: ${HEP4M_RUNS}

loss_config:
  token_wt: 1.0
  pos_token_wt: 1.0
  card_wt: 1.0
  label_smoothing: 0.1
  pos_label_smoothing: 0.1
  card_label_smoothing: 0.1
  modality_wt: {}
