# HEP4M-pflow: particle flow with the parallel engine, (topo, track) -> truth particles, argmax.
# The parallel engine tokenises the raw ROOT inputs on the fly with the frozen tokenisers.
#   python -m hep4m.eval_hep4m -i configs/infer/HEP4M-pflow.yml [--gpu -1] [--items 0]
# Writes <output_dir>/<dir_flag>/prediction_<input file>_<suffix>.root
init:
  device: cuda
  gpu: 0                 # -1: CPU
  precision: highest
  chunk_size: 64
  batch_size: 32
  num_workers: 2
  output_dir: ${HEP4M_OUTPUT_ROOT}/inference/HEP4M-pflow

  model:                 # unpacked by: python -m hep4m.data download --checkpoints HEP4M-pflow
    config_path_m: ${HEP4M_CKPT}/ckpt.HEP4M-pflow/config_m.yml
    checkpoint_path: ${HEP4M_CKPT}/ckpt.HEP4M-pflow/model.ckpt
    modality_dict_path: ${HEP4M_CKPT}/ckpt.HEP4M-pflow/modality_dict.yml

items:
  - info: particle flow, argmax
    input_modalities: [topo, track]
    output_modalities: [truthpart]
    use_truth_cardinality: false
    card_topk_dict:              {truthpart: 1}     # 1: argmax, -1: sample
    card_temperature_dict:       {truthpart: 1.0}
    top_k_token_dict:            {truthpart: 1}     # 1: argmax, -1: sample, k: top-k
    top_k_gpos_token_dict:       {truthpart: 1}
    temperature_token_dict:      {truthpart: 1.0}
    temperature_gpos_token_dict: {truthpart: 1.0}
    filepath_dict:               # raw ROOT file(s) per modality: inputs and the truth for comparison
      topo:      "['${HEP4M_RAW_TEST}']"
      track:     "['${HEP4M_RAW_TEST}']"
      truthpart: "['${HEP4M_RAW_TEST}']"
    dir_flag: pflow
    suffix: argmax
    reduce_ds: -1          # number of events, -1: all
