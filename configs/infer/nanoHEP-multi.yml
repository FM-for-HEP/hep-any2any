# nanoHEP-multi: one model trained on all seven modalities; each item picks a direction.
# Items: 0 particle flow, 1 detector simulation, 2 flash simulation. Any subset of
# modalities can be the input and any other subset the output, e.g.
#   input: [topo, track, cell]    output: [truthpart]     (particle flow with cells)
#   python -m hep4m.eval_hep4m -i configs/infer/nanoHEP-multi.yml [--gpu -1] [--items 2]
init:
  model_type: nano_hep
  device: cuda
  gpu: 0                 # -1: CPU
  precision: highest
  chunk_size: 128
  batch_size: 32
  output_dir: ${HEP4M_OUTPUT_ROOT}/inference/nanoHEP-multi

  model:                 # unpacked by: python -m hep4m.data download --checkpoints nanoHEP-multi
    checkpoint_path: ${HEP4M_CKPT}/ckpt.nanoHEP-multi/model.ckpt
    modality_dict_path: ${HEP4M_REPO}/configs/modality_dicts/7mod.yml   # the tokenisers of this model

  nano_hep:
    tokenized_root: ${HEP4M_TOKENIZED}
    split: test
    max_events: -1       # -1: all events of the split

items:
  - info: particle flow, argmax
    sampling_dict:
      type: inference
      fixed_input_output_modalities:
        input: [track, topo]
        output: [truthpart]
      output_layout: grouped
      input_layout: grouped
    temperature: 1.0
    argmax: true
    structural_decode: true
    max_new_tokens: 512
    dir_flag: pflow
    suffix: argmax

  - info: detector simulation, sampled
    sampling_dict:
      type: inference
      fixed_input_output_modalities:
        input: [truthpart]
        output: [topo, track]
      output_layout: grouped
      input_layout: grouped
    temperature: 1.0
    argmax: false
    structural_decode: true
    max_new_tokens: 1024
    dir_flag: sim
    suffix: sampled

  - info: flash simulation (truth particles -> HGPflow particles), argmax
    sampling_dict:
      type: inference
      fixed_input_output_modalities:
        input: [truthpart]
        output: [hgpfpart]
      output_layout: grouped
      input_layout: grouped
    temperature: 1.0
    argmax: true
    structural_decode: true
    max_new_tokens: 1024
    dir_flag: flashsim
    suffix: argmax
