# Tokenise the celltruth objects of raw COCOA ROOT files with the frozen celltruth tokeniser.
#   python -m hep4m.eval_tokenizer -i configs/tokenize/celltruth.yml [--gpu -1]
# Output: ${HEP4M_WORK}/tokenized_root/celltruth/<dir_flag>/<input file name>
init:
  gpu: 0                 # -1: CPU
  precision: highest
  chunk_size: 128
  batch_size: 128
  num_workers: 0
  output_dir: ${HEP4M_WORK}/tokenized_root/celltruth
  indicator_logit_threshold: 0.0   # cell images: a cell is kept when its indicator logit > threshold

  model:
    config_path_v   : ${HEP4M_TOKENIZERS}/vqxcelltrx2048x8xq3x2xxxxt0u78n6/config_v.yml
    config_path_m   : ${HEP4M_TOKENIZERS}/vqxcelltrx2048x8xq3x2xxxxt0u78n6/config_m.yml
    checkpoint_path : ${HEP4M_TOKENIZERS}/vqxcelltrx2048x8xq3x2xxxxt0u78n6/checkpoints/epoch=50-val_total_loss=0.0035.ckpt

items:
  - info: test file singlejet_0
    input_path: ${HEP4M_RAW_TEST}
    dir_flag: test
    reduce_ds: -1        # number of events, -1: all
