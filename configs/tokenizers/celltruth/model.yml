n_feat_cont: &n_feat_cont 4
common_emb_dim: &emb_dim 128
codebook_dim: &codebook_dim 8
enable_flash_attn: &flash_attn True

vae_type: cellimg_transformer
use_pos_emb: true
pos_emb_len: 156

# patch size is 2^pow2_scale x 2^pow2_scale
pow2_scale: [3, 3, 3, 3, 3, 2]

encoder:
    # patchify and linear transformation
    conv2d:
        in_channels: 1
        out_channels: *emb_dim
        padding: 0
        bias: false

    transformer: # with GLU
        embed_dim: *emb_dim
        num_layers: 8
        mha_config:   
            enable_flash_attn: *flash_attn
            num_heads: 8
        dense_config: 
            embed_dim: *emb_dim
            hidden_dim: *emb_dim
        out_dim: *emb_dim
        layer_scale: true
        apply_norm_after_last_proj: true


quantizer:
    type: ResidualVQ
    dim: *emb_dim
    num_quantizers: 3
    codebook_dim: *codebook_dim
    codebook_size: 2048
    kmeans_init: True


decoder:
    transformer: # with GLU
        embed_dim: *emb_dim
        num_layers: 8
        mha_config:   
            enable_flash_attn: *flash_attn
            num_heads: 8
        dense_config: 
            embed_dim: *emb_dim
            hidden_dim: *emb_dim
        out_dim: *emb_dim
        layer_scale: true
        apply_norm_after_last_proj: true

    num_tokens_per_layer: [64, 64, 16, 4, 4, 4]

    output_conv2d:
        in_out_channels: [[64, 64], [64, 32]]
        kernel_sizes: [5, 3]
        out_channels: 1